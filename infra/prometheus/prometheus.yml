# Prometheus fetches ("scrapes") the API's /metrics page every 5 seconds.
# The API runs on your machine, not in Docker; host.docker.internal is how a
# container reaches the machine it runs on.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: opsdesk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
