# Local dependencies for OpsDesk. Start with `make up`.
# Values come from the .env file in the repository root.
name: opsdesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      # Do not look up the client's host name before saying hello: with slow
      # DNS that makes every SMTP connection hang.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Observability. Only started with `make observe` (profile "observability"),
  # so `make up` stays as small as before.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports:
      # 9091 on the host: 9090 is used by another project on this machine.
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      # Local only: no login screen; everyone is an admin. Never do this outside a laptop.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
