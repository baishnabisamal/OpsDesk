# Continuous integration: every push and pull request runs the same checks
# as `make lint` and `make test`, on a clean machine. A change that passes on
# one laptop but needs something only that laptop has fails here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  api:
    name: API tests (unit + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Integration tests start their own PostgreSQL, Redis and Mailpit with
      # Testcontainers. GitHub's Ubuntu runners have Docker, so nothing else
      # is needed: no service containers, no .env file.
      - run: npm test --workspace api

  web:
    name: Web tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test --workspace web
      - run: npm run build --workspace web

  ml:
    name: ML service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      # The tests train a small model on generated data in a temp folder.
      - run: python -m pytest -q

  deploy:
    name: Deployment stack builds, starts and answers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The same script a real server uses, then two changes for a runner:
      # plain HTTP on localhost (no certificate), and no real mail provider.
      - name: Create deploy/.env
        run: |
          ./deploy/init-env.sh localhost
          sed -i \
            -e 's|^SITE_ADDRESS=.*|SITE_ADDRESS=http://localhost|' \
            -e 's|^APP_URL=.*|APP_URL=http://localhost|' \
            -e 's|^SMTP_HOST=.*|SMTP_HOST=127.0.0.1|' \
            -e 's|^SMTP_PORT=.*|SMTP_PORT=1025|' \
            deploy/.env
      - name: Build and start every container
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build --wait
      - name: Smoke test through Caddy
        run: |
          set -euo pipefail
          compose() { docker compose --env-file deploy/.env -f deploy/docker-compose.yml "$@"; }
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          # The API is up and can reach PostgreSQL and Redis.
          curl -fsS http://localhost/readyz
          # The React app, and its fallback for a deep link.
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS http://localhost/tickets/123 | grep -q '<div id="root">'
          # Metrics stay internal.
          test "$(status http://localhost/metrics)" = 404
          # The WebSocket gateway answers its handshake.
          curl -fsS 'http://localhost/socket.io/?EIO=4&transport=polling' | grep -q '"sid"'

          # Demo data, then a real sign-in and an authenticated read.
          compose run --rm -e ALLOW_DEMO_SEED=true migrate node dist/scripts/seed.js
          token=$(curl -fsS http://localhost/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"user1@skyline-travels.test","password":"Password123!"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost/api/v1/tickets -H "Authorization: Bearer $token" | grep -q '"items"'
          echo "smoke test passed"
      - name: Container logs
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs --tail 100
